<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ post.title | e }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f5f7;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);">
          {% if hero_abs %}
          <tr>
            <td style="padding:0;line-height:0;">
              <a href="{{ post_url | e }}" style="display:block;text-decoration:none;">
                <img src="{{ hero_abs | e }}" alt="{{ post.title | e }}" width="600" style="width:100%;max-width:600px;height:auto;display:block;border:0;">
              </a>
            </td>
          </tr>
          {% endif %}
          <tr>
            <td style="padding:28px 28px 8px 28px;">
              <p style="margin:0 0 8px 0;font-size:13px;color:#6c757d;">S366 AI — blog</p>
              <h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.25;color:#111827;">
                <a href="{{ post_url | e }}" style="color:#0d6efd;text-decoration:none;">{{ post.title | e }}</a>
              </h1>
              {% if post.excerpt %}
              <p style="margin:0 0 20px 0;font-size:15px;line-height:1.55;color:#374151;">{{ post.excerpt | e }}</p>
              {% endif %}
              <p style="margin:0 0 8px 0;">
                <a href="{{ post_url | e }}" style="display:inline-block;padding:12px 22px;background:#0d6efd;color:#ffffff;text-decoration:none;border-radius:999px;font-size:15px;font-weight:600;">Citește articolul</a>
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 28px 28px;border-top:1px solid #e9ecef;">
              <p style="margin:0;font-size:12px;color:#9ca3af;line-height:1.5;">
                Primești acest mesaj pentru că ești abonat la newsletter-ul blogului.
                <a href="{{ unsub_url | e }}" style="color:#6b7280;">Dezabonare</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
